name: Release build

# Builds the Windows x64 installer and portable archive on tag push and
# attaches them to a GitHub Release. Manual dispatch is enabled so a build
# can be produced before tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pins 1.94.1 / x86_64-pc-windows-msvc)
        run: rustup toolchain install

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build installer and portable bundle
        shell: pwsh
        run: |
          .\build.ps1 -Python (Get-Command python).Source -WorkDir 'D:\tokenlens-build'

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item 'D:\tokenlens-build\target\x86_64-pc-windows-msvc\release\bundle\nsis\*-setup.exe' artifacts\
          Compress-Archive -Path 'D:\tokenlens-build\portable\*' -DestinationPath artifacts\TokenLens-${{ github.ref_name }}-portable-windows-x64.zip
          Get-ChildItem artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: tokenlens-windows-x64
          path: artifacts/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
