name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile all modules
        run: python -m compileall -q backend/tokenlens backend/service.py

      - name: Run unit tests
        run: python -m unittest discover -s backend/tests -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify index.html references resolve
        run: python tools/check_frontend_assets.py

      - name: Check JavaScript syntax
        run: |
          for script in frontend/*.js; do
            node --check "$script"
          done

      - name: Test derived usage metrics
        run: node --test tools/test_usage_metrics.cjs

  rust:
    name: Rust host check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml pins 1.94.1)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Provide placeholder sidecar binary
        # tauri-build validates that the externalBin resource exists even for
        # cargo check; the real sidecar is built by build.ps1 / release.yml.
        working-directory: src-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path binaries | Out-Null
          Set-Content -Path 'binaries\tokenlens-service-x86_64-pc-windows-msvc.exe' -Value 'ci placeholder'

      - name: Cargo check the Tauri host
        working-directory: src-tauri
        run: cargo check --locked
